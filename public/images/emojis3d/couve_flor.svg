<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="inSh" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <radialGradient id="leafG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="45%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="leafDarkG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#052e16"/>
    </radialGradient>
    
    <radialGradient id="cauliG" cx="38%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#d6d3d1"/>
    </radialGradient>
  
  </defs>
  <g filter="url(#sh)">
    
    <circle cx="34" cy="74" r="26" fill="url(#leafDarkG)"/>
    <circle cx="94" cy="74" r="26" fill="url(#leafDarkG)"/>
    <ellipse cx="64" cy="90" rx="44" ry="22" fill="url(#leafG)"/>
    <circle cx="46" cy="54" r="20" fill="url(#cauliG)"/>
    <circle cx="82" cy="54" r="20" fill="url(#cauliG)"/>
    <circle cx="64" cy="42" r="22" fill="url(#cauliG)"/>
    <circle cx="52" cy="68" r="20" fill="url(#cauliG)" filter="url(#inSh)"/>
    <circle cx="76" cy="68" r="20" fill="url(#cauliG)" filter="url(#inSh)"/>
    <circle cx="64" cy="58" r="22" fill="url(#cauliG)" filter="url(#inSh)"/>
  
  </g>
