  </defs>
  <g filter="url(#sh)">
    
    <ellipse cx="64" cy="34" rx="38" ry="16" transform="rotate(-15 64 34)" fill="url(#leafDarkG)"/>
    <ellipse cx="46" cy="76" rx="22" ry="26" fill="url(#loqG)"/>
