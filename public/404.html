<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <title>Horta Viva</title>
    <script type="text/javascript">
      // Redireciona qualquer rota direta do GitHub Pages para a rota Hash correspondente
      var l = window.location;
      var path = l.pathname;
      var repoName = '/Horta-Viva';
      var route = '';
      if (path.indexOf(repoName) === 0) {
        route = path.substring(repoName.length);
      } else {
        route = path;
      }
      if (!route || route === '/') {
        route = '/';
      } else if (route.charAt(0) !== '/') {
        route = '/' + route;
      }
      var target = l.origin + repoName + '/#' + route + (l.search ? l.search : '') + l.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
